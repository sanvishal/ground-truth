    <style>
      html, body { margin: 0; min-height: 100%; background: #010306; }
      #game-loader { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; background: #010306; color: #a9aaa3; }

      #loader-status { min-height: 20px; margin-bottom: 13px; color: #a9aaa3; font: 700 14px ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; letter-spacing: .1em; text-align: center; }

          <div class="loader-stars loader-stars--far" aria-hidden="true"></div>
          <div class="loader-stars loader-stars--near" aria-hidden="true"></div>
          <div class="loader-frame">
            <div id="loader-status">PREPARING SANCTUARY...</div>
